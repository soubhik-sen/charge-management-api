projects:
  - name: LEDGERFLOW
    environments:
      - name: Dev & QA
        services:
          - type: web
            name: ledgerflow-api-devqa
            runtime: python
            plan: free
            region: frankfurt
            branch: main
            autoDeploy: true
            buildCommand: pip install .
            startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
            healthCheckPath: /health
            envVars:
              - key: PYTHON_VERSION
                value: 3.13.7
              - key: DATABASE_URL
                fromDatabase:
                  name: ledgerflow-db-devqa
                  property: connectionString
              - key: AUTH_MODE
                value: jwt
              - key: JWT_ISSUER
                value: https://ledgerflow.dev-qa/
              - key: JWT_AUDIENCE
                value: charge-management-api
              - key: JWT_ALGORITHMS
                value: HS256
              - key: JWT_SHARED_SECRET
                generateValue: true
              - key: JWT_ROLES_CLAIM
                value: roles
              - key: JWT_TENANT_CLAIM
                value: tenant_id
              - key: JWT_LEEWAY_SECONDS
                value: "30"
        databases:
          - name: ledgerflow-db-devqa
            databaseName: ledgerflow
            user: ledgerflow
            plan: free
            region: frankfurt
            postgresMajorVersion: "18"
            ipAllowList: []
        networking:
          isolation: enabled
        permissions:
          protection: disabled
